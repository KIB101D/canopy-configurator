<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Canopy Configurator</title>
  </head>
  <body>
    <div id="app">
      <main id="viewport">
        <div id="canvas-host"></div>
        <div id="plan-view" hidden></div>

        <nav id="toolbar" aria-label="View tools">
          <div class="tool-group">
            <button type="button" class="tool" data-action="fullscreen" title="Fullscreen"></button>
            <button type="button" class="tool" data-action="view" title="Switch to 2D plan"></button>
          </div>
          <div class="tool-group">
            <button type="button" class="tool" data-action="zoom-in" title="Zoom in"></button>
            <button type="button" class="tool" data-action="zoom-out" title="Zoom out"></button>
          </div>
          <div class="tool-group">
            <button type="button" class="tool is-active" data-action="dimensions" title="Dimension lines" aria-pressed="true"></button>
            <button type="button" class="tool" data-action="reset" title="Reset view"></button>
          </div>
        </nav>

        <div id="loader" role="status">
          <span class="loader-dot"></span>
          Loading models…
        </div>
      </main>

      <aside id="panel">
        <header class="panel-header">
          <p class="eyebrow">Timber canopy</p>
          <h1>Configurator</h1>
        </header>

        <div class="sections">
          <details class="section" name="cfg" open>
            <summary><span class="step">1</span>Dimensions</summary>
            <div class="section-body">
              <div class="dim-row" data-key="width">
                <div class="dim-head">
                  <label for="width">Width</label>
                  <span class="dim-hint">between column centres</span>
                </div>
                <div class="dim-control">
                  <button type="button" class="step-btn" data-step="-1" aria-label="Decrease width">−</button>
                  <input id="width" class="dim-input" type="number" min="2" max="8" step="0.1" inputmode="decimal" />
                  <span class="dim-unit">m</span>
                  <button type="button" class="step-btn" data-step="1" aria-label="Increase width">+</button>
                </div>
                <input class="dim-range" type="range" min="2" max="8" step="0.1" aria-label="Width" />
                <span class="dim-warning" aria-live="polite"></span>
              </div>

              <div class="dim-row" data-key="depth">
                <div class="dim-head">
                  <label for="depth">Depth</label>
                  <span class="dim-hint">split into 2 bays</span>
                </div>
                <div class="dim-control">
                  <button type="button" class="step-btn" data-step="-1" aria-label="Decrease depth">−</button>
                  <input id="depth" class="dim-input" type="number" min="2" max="8" step="0.1" inputmode="decimal" />
                  <span class="dim-unit">m</span>
                  <button type="button" class="step-btn" data-step="1" aria-label="Increase depth">+</button>
                </div>
                <input class="dim-range" type="range" min="2" max="8" step="0.1" aria-label="Depth" />
                <span class="dim-warning" aria-live="polite"></span>
              </div>

              <div class="dim-row" data-key="height">
                <div class="dim-head">
                  <label for="height">Height</label>
                  <span class="dim-hint">column height</span>
                </div>
                <div class="dim-control">
                  <button type="button" class="step-btn" data-step="-1" aria-label="Decrease height">−</button>
                  <input id="height" class="dim-input" type="number" min="2" max="8" step="0.1" inputmode="decimal" />
                  <span class="dim-unit">m</span>
                  <button type="button" class="step-btn" data-step="1" aria-label="Increase height">+</button>
                </div>
                <input class="dim-range" type="range" min="2" max="8" step="0.1" aria-label="Height" />
                <span class="dim-warning" aria-live="polite"></span>
              </div>
            </div>
          </details>

          <details class="section" name="cfg">
            <summary><span class="step">2</span>Walls</summary>
            <div class="section-body">
              <div id="wall-picker" class="wall-picker"></div>
              <p class="picker-hint" id="picker-hint"></p>
              <div class="wall-types" id="wall-types" role="radiogroup" aria-label="Wall type"></div>
              <div class="row-actions">
                <button type="button" class="link-btn" data-walls="perimeter">Apply to all outer sides</button>
                <button type="button" class="link-btn" data-walls="clear">Clear walls</button>
              </div>
            </div>
          </details>

          <details class="section" name="cfg">
            <summary><span class="step">3</span>Storage room</summary>
            <div class="section-body">
              <p class="section-note">Encloses one bay with timber walls, a glazed door and a plank floor.</p>
              <div class="field-label">Bay</div>
              <div class="segmented" data-field="bay">
                <button type="button" data-value="none">None</button>
                <button type="button" data-value="back">Back bay</button>
                <button type="button" data-value="front">Front bay</button>
              </div>
              <div class="field-label">Door position</div>
              <div class="segmented" data-field="door">
                <button type="button" data-value="side">Long side</button>
                <button type="button" data-value="end">End wall</button>
                <button type="button" data-value="partition">Inside</button>
              </div>
            </div>
          </details>

          <details class="section" name="cfg">
            <summary><span class="step">4</span>Display</summary>
            <div class="section-body">
              <label class="switch">
                <input id="textures-checkbox" type="checkbox" checked />
                <span class="switch-track"></span>
                Real materials
                <span class="switch-hint">wood, asphalt, aluminium</span>
              </label>
              <label class="switch">
                <input id="dimensions-checkbox" type="checkbox" checked />
                <span class="switch-track"></span>
                Dimension lines
              </label>
            </div>
          </details>
        </div>

        <footer class="panel-footer">
          <dl class="summary" id="summary"></dl>
          <button type="button" class="primary-btn" id="share-btn">Copy configuration link</button>
        </footer>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
